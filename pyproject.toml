[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quell-habits"
version = "0.2.0"
description = "Local hair-habit and posture intervention dashboard"
requires-python = ">=3.10"
dependencies = [
  "mediapipe>=0.10",
  "numpy>=1.20",
  "opencv-python>=4.5",
  "pandas>=1.3",
  "pillow>=9",
  "scikit-learn>=1.1",
]

[project.scripts]
quell = "quell_app:main"

[tool.setuptools]
py-modules = [
  "collect",
  "collect_posture",
  "features",
  "posture",
  "posture_features",
  "posture_runtime",
  "quell_app",
  "quell_stats",
  "train",
  "train_posture",
  "webcam",
]

[tool.setuptools.data-files]
"share/quell/assets" = [
  "assets/quell-logo.svg",
  "assets/quell-mark.svg",
]
